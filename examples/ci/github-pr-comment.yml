name: Patchline PR data-risk comment

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  patchline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: thehalleyyoung/patchline@main
        with:
          path: .
          subpath: db/migrate
          out: results/patchline-pr
          comment-on-pr: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Patchline PR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchline-pr-comment
          path: results/patchline-pr
