stages:
  - data-risk

patchline:data-risk:
  stage: data-risk
  image: golang:1.24
  script:
    - go run github.com/thehalleyyoung/patchline/cmd/patchline@main repo analyze . --stages inventory,baseline --ci --out results/patchline
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - results/patchline/analysis-bundle/
      - results/patchline/ci/summary.md
      - results/patchline/ci/gl-code-quality-report.json
    reports:
      codequality: results/patchline/ci/gl-code-quality-report.json
